<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoGrid Rank Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside id="side">
  <header class="brand">
    <span class="logo">◉</span> GeoGrid <small>local rank heatmaps</small>
  </header>

  <section>
    <h2>Business</h2>
    <select id="bizSelect"><option value="">— add a business below —</option></select>
    <div id="bizInfo" class="muted small"></div>
    <form id="bizForm" class="row">
      <input id="bizQuery" placeholder="Google Maps link, or “Name, City”" autocomplete="off">
      <button type="submit" class="secondary">Add</button>
    </form>
    <div id="bizMsg" class="small"></div>
  </section>

  <section>
    <h2>New scan</h2>
    <label>Keywords <span class="muted">(one per line)</span>
      <textarea id="keywords" rows="3" placeholder="plumber&#10;emergency plumber"></textarea>
    </label>
    <div class="row">
      <label>Grid
        <select id="gridSize">
          <option>3</option><option>5</option><option selected>7</option><option>9</option><option>11</option><option>13</option>
        </select>
      </label>
      <label>Spacing
        <span class="row tight">
          <input id="spacing" type="number" min="0.1" step="0.1" value="1">
          <select id="unit"><option value="km">km</option><option value="mi">mi</option></select>
        </span>
      </label>
    </div>
    <div id="gridHint" class="muted small"></div>
    <div class="small muted">Drag the <b>blue center pin</b> to move the grid. <a href="#" id="previewGrid">Preview grid</a> · <a href="#" id="resetCenter">Reset to business</a></div>
    <button id="runBtn" class="primary" disabled>Run scan</button>
    <div id="runMsg" class="small"></div>
  </section>

  <section class="grow">
    <h2>History</h2>
    <ul id="history" class="history"><li class="muted small">No scans yet.</li></ul>
  </section>
</aside>

<main>
  <div id="map"></div>

  <div id="scanCard" class="card hidden">
    <div class="card-head">
      <div>
        <div id="scanTitle" class="title"></div>
        <div id="scanSub" class="muted small"></div>
      </div>
      <div class="actions">
        <button id="printBtn" class="ghost" title="Export as PDF via the print dialog">PDF</button>
        <button id="deleteBtn" class="ghost danger" title="Delete this scan">Delete</button>
      </div>
    </div>
    <div id="progress" class="progress hidden"><div></div><span></span></div>
    <div id="metrics" class="metrics"></div>
    <div class="toggle" id="viewToggle">
      <button data-mode="rank" class="on">Ranks</button>
      <button data-mode="delta" id="deltaBtn" disabled title="Needs an earlier scan with the same keyword and grid">Change vs previous</button>
    </div>
    <div id="viewing" class="small"></div>
  </div>

  <div id="compCard" class="card hidden">
    <div class="card-head">
      <div class="title">Competitors <span class="muted small">click a row to map their ranks</span></div>
      <button id="compToggle" class="ghost">–</button>
    </div>
    <div id="compBody">
      <table id="compTable">
        <thead><tr><th>#</th><th>Business</th><th>SoLV</th><th>ATRP</th><th>Found</th><th>★</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="legend card">
    <span><i class="sw r1"></i>1–3</span><span><i class="sw r2"></i>4–10</span>
    <span><i class="sw r3"></i>11–20</span><span><i class="sw r4"></i>20+</span><span><i class="sw rx"></i>error</span>
  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
